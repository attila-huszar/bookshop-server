x-loki-options: &loki-options
  loki-url: 'http://127.0.0.1:3100/loki/api/v1/push'
  loki-retries: '3'
  loki-timeout: '1s'
  loki-max-backoff: '1s'
  max-size: '10m'
  max-file: '3'
  loki-pipeline-stages: |
    - json:
        expressions:
          level: level
          source: source
    - labels:
        level:
        source:

services:
  server:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    profiles: ['sqlite']
    ports:
      - '${PORT:-5000}:5000'
    networks:
      default:
        aliases: [api]
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped
    env_file: .env
    environment:
      DB_REPO: SQLITE
      PORT: '5000'
      REDIS_URL: redis://redis:6379
      SETUP: '${SETUP:-}'
      NODE_ENV: '${NODE_ENV:-development}'
      NGROK_AUTHTOKEN: '${NGROK_AUTHTOKEN:-}'
    entrypoint: ['sh', 'docker/entrypoint.sh']
    command: ['bun', '${BUN_RUN_MODE:-run}', 'src/app.ts']

    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: 'job=server'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:5000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ./src:/bookshop-server/src
      - sqlite_data:/bookshop-server/data

  server-with-mongo:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    profiles: ['mongo']
    ports:
      - '${PORT:-5000}:5000'
    networks:
      default:
        aliases: [api]
    depends_on:
      mongodb:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped
    env_file: .env
    environment:
      DB_REPO: MONGO
      PORT: '5000'
      REDIS_URL: redis://redis:6379
      SETUP: '${SETUP:-}'
      NODE_ENV: '${NODE_ENV:-development}'
      NGROK_AUTHTOKEN: '${NGROK_AUTHTOKEN:-}'
    entrypoint: ['sh', 'docker/entrypoint.sh']
    command: ['bun', '${BUN_RUN_MODE:-run}', 'src/app.ts']

    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: 'job=server-with-mongo'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:5000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ./src:/bookshop-server/src

  mongodb:
    image: mongo
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--quiet']
    profiles: ['mongo']
    ports:
      - '27017:27017'
    depends_on:
      loki:
        condition: service_started
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: 'job=mongodb'
        loki-pipeline-stages: |
          - json:
              expressions:
                severity: s
                context: ctx
          - drop:
              source: [severity, context]
              expression: '^I;Checkpointer$'
          - template:
              source: level
              template: '{{ if .severity }}{{ if eq .severity "I" }}info{{ else if eq .severity "W" }}warn{{ else if or (eq .severity "E") (eq .severity "F") }}error{{ else }}debug{{ end }}{{ end }}'
          - labels:
              level:
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { if (rs.status().ok) { quit(db.hello().isWritablePrimary ? 0 : 1) } } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}); quit(1) }",
          'mongodb://127.0.0.1:27017/admin',
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PUBLISHED_PORT:-6380}:6379'
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction --appendonly yes --appendfsync always --loglevel warning
    depends_on:
      loki:
        condition: service_started
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: 'job=redis'
        loki-pipeline-stages: |
          - static_labels:
              level: warn
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    init: true
    stop_grace_period: 50s
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    profiles: ['sqlite']
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped
    env_file: .env
    environment:
      DB_REPO: SQLITE
      REDIS_URL: redis://redis:6379
      NODE_ENV: '${NODE_ENV:-development}'
    command: ['bun', '${BUN_RUN_MODE:-run}', 'src/workers/email.worker.ts']
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: 'job=worker'
    volumes:
      - ./src:/bookshop-server/src
      - sqlite_data:/bookshop-server/data

  worker-with-mongo:
    init: true
    stop_grace_period: 50s
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    profiles: ['mongo']
    depends_on:
      redis:
        condition: service_healthy
      server-with-mongo:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped
    env_file: .env
    environment:
      DB_REPO: MONGO
      REDIS_URL: redis://redis:6379
      NODE_ENV: '${NODE_ENV:-development}'
    command: ['bun', '${BUN_RUN_MODE:-run}', 'src/workers/email.worker.ts']
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: 'job=worker-with-mongo'
    volumes:
      - ./src:/bookshop-server/src

  cron:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
      target: cron
    profiles: ['sqlite']
    depends_on:
      server:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped
    env_file: .env
    environment:
      DB_REPO: SQLITE
      CRON_FILE: /bookshop-server/docker/cron/sqlite.crontab
      REDIS_URL: redis://redis:6379
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: 'job=cron'
    volumes:
      - ./src:/bookshop-server/src
      - ./docker/cron:/bookshop-server/docker/cron
      - sqlite_data:/bookshop-server/data
      # Intentionally override /bookshop-server/data/backups so backup archives persist independently.
      - backups_data:/bookshop-server/data/backups

  cron-with-mongo:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
      target: cron
    profiles: ['mongo']
    depends_on:
      server-with-mongo:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped
    env_file: .env
    environment:
      DB_REPO: MONGO
      CRON_FILE: /bookshop-server/docker/cron/mongo.crontab
      REDIS_URL: redis://redis:6379
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: 'job=cron-with-mongo'
    volumes:
      - ./src:/bookshop-server/src
      - ./docker/cron:/bookshop-server/docker/cron
      - backups_data:/bookshop-server/data/backups

  loki:
    image: grafana/loki
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'
    ports:
      - '3100:3100'
    volumes:
      - loki-data:/loki
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml
    command: -config.file=/etc/loki/loki-config.yaml
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s/grafana'
      GF_LOG_MODE: console
      GF_LOG_LEVEL: warn
      GF_LOG_CONSOLE_FORMAT: json
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: 'job=grafana'
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: 'job=nginx'
        loki-pipeline-stages: |
          - json:
              expressions:
                level: level
          - regex:
              expression: '^\S+\s+\S+\s+\[(?P<nginx_level>warn|error|crit|alert|emerg)\]'
          - template:
              source: level
              template: '{{ if .nginx_level }}{{ if eq .nginx_level "warn" }}warn{{ else }}error{{ end }}{{ else }}{{ .Value }}{{ end }}'
          - labels:
              level:
    depends_on:
      grafana:
        condition: service_started
    ports:
      - '80:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  redis_data:
  sqlite_data:
  mongodb_data:
  backups_data:
  loki-data:
  grafana-data:
