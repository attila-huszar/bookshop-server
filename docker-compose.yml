x-app-environment: &app-environment
  DB_REPO: '${DB_REPO:?Set DB_REPO to MONGO or SQLITE in .env}'
  REDIS_URL: redis://redis:6379
  NODE_ENV: '${NODE_ENV:-development}'
  BOOKSHOP_DATABASE_COORDINATION_DIR: /bookshop-server/runtime

x-loki-options: &loki-options
  loki-url: 'http://127.0.0.1:3100/loki/api/v1/push'
  loki-retries: '3'
  loki-timeout: '1s'
  loki-max-backoff: '1s'
  max-size: '10m'
  max-file: '3'
  loki-pipeline-stages: |
    - json:
        expressions:
          level: level
          source: source
    - labels:
        level:
        source:

services:
  server:
    init: true
    stop_grace_period: 15s
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    ports:
      - '${PORT:-5000}:5000'
    networks:
      default:
        aliases: [api]
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-environment
      PORT: '5000'
      NGROK_AUTHTOKEN: '${NGROK_AUTHTOKEN:-}'
    command:
      [
        '/bin/sh',
        'docker/database-access.sh',
        'service',
        'bun',
        '${BUN_RUN_MODE:-run}',
        'src/server.ts',
      ]

    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: 'job=server'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:5000/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ./src:/bookshop-server/src
      - sqlite_data:/bookshop-server/data
      - database_runtime:/bookshop-server/runtime

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PUBLISHED_PORT:-6380}:6379'
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction --appendonly yes --appendfsync always --loglevel warning
    depends_on:
      loki:
        condition: service_started
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: 'job=redis'
        loki-pipeline-stages: |
          - static_labels:
              level: warn
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    init: true
    stop_grace_period: 50s
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-environment
    command:
      [
        '/bin/sh',
        'docker/database-access.sh',
        'service',
        'bun',
        '${BUN_RUN_MODE:-run}',
        'src/worker.ts',
      ]
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: 'job=worker'
    volumes:
      - ./src:/bookshop-server/src
      - sqlite_data:/bookshop-server/data
      - database_runtime:/bookshop-server/runtime

  cron:
    init: true
    stop_grace_period: 15s
    build:
      context: .
      dockerfile: Dockerfile
      target: cron
    depends_on:
      server:
        condition: service_healthy
      loki:
        condition: service_started
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-environment
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: 'job=cron'
    volumes:
      - ./src:/bookshop-server/src
      - ./docker/cron:/bookshop-server/docker/cron
      - sqlite_data:/bookshop-server/data
      - database_runtime:/bookshop-server/runtime

  loki:
    image: grafana/loki
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '3'
    ports:
      - '3100:3100'
    volumes:
      - loki-data:/loki
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml
    command: -config.file=/etc/loki/loki-config.yaml
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s/grafana'
      GF_LOG_MODE: console
      GF_LOG_LEVEL: warn
      GF_LOG_CONSOLE_FORMAT: json
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: 'job=grafana'
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging:
      driver: loki
      options:
        <<: *loki-options
        loki-external-labels: 'job=nginx'
        loki-pipeline-stages: |
          - json:
              expressions:
                level: level
          - regex:
              expression: '^\S+\s+\S+\s+\[(?P<nginx_level>warn|error|crit|alert|emerg)\]'
          - template:
              source: level
              template: '{{ if .nginx_level }}{{ if eq .nginx_level "warn" }}warn{{ else }}error{{ end }}{{ else }}{{ .Value }}{{ end }}'
          - labels:
              level:
    depends_on:
      grafana:
        condition: service_started
    ports:
      - '80:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  database_runtime:
  redis_data:
  sqlite_data:
  loki-data:
  grafana-data:
