name: Bun CI

on:
  push:
  pull_request:
    branches: ['master']

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun lint
      - run: bunx tsc -b
      - run: bun test
